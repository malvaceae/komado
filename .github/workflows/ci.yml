name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and test without interactive system permissions
        run: >-
          swift test --package-path macos --only-use-versions-from-resolved-file
          --skip 'HostModelTests|HostTLSIdentityStoreTests|PairedDeviceRegistryTests|ListenerAccessTests|SignalingServerTests|DisplayCaptureTests|IdleSleepActivityTests|SystemInputTests'

  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Build, lint and test
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            ./gradlew :core:test :security:lintDebug :app:lintDebug :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/komado-gradle.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
            if (( statuses[0] == 0 )); then exit 0; fi
            if (( attempt == 3 )) || ! grep -Fq 'Received status code 429 from server' "$RUNNER_TEMP/komado-gradle.log"; then
              exit "${statuses[0]}"
            fi
            echo "Dependency repository returned HTTP 429; retrying."
            sleep "$((attempt * 15))"
          done
