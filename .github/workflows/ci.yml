name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and test without interactive system permissions
        run: >-
          swift test --package-path macos --only-use-versions-from-resolved-file
          --skip 'HostModelTests|HostTLSIdentityStoreTests|PairedDeviceRegistryTests|ListenerAccessTests|SignalingServerTests|DisplayCaptureTests|IdleSleepActivityTests'

  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0'
      - name: Build, lint and test
        run: ./gradlew :core:test :security:lintDebug :app:lintDebug :app:assembleDebug
        working-directory: android
